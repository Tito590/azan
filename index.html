<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11170f">
<title>Kamanika — Argopuro 360°</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
  <div id="panoramaViewport"><div id="panoramaTrack">
    <img class="panoImage" id="panoA" alt="" decoding="async" draggable="false">
    <img class="panoImage" id="panoB" alt="" decoding="async" draggable="false">
  </div></div>
  <div class="shade"></div>
  <header><div class="brand">KAMANIKA <span>ROASTERY</span></div></header>
  <main>
    <div id="gesture"></div>
    <div class="hint"><div class="hand">↔</div><b>Geser untuk melihat kebun</b><span>Geser kiri atau kanan</span></div>
    <div class="speech"><div class="tail"></div><b>Halo, Teman Ngopi!</b><span id="speech"></span></div>
    <div class="farmer"><img id="farmer" alt="Petani Argopuro" decoding="async"></div>
    <div class="pouch"><img id="pouch" alt="Kamanika Argopuro" decoding="async"></div>
    <div class="hud"><small>PANDANGAN</small><strong id="direction">DEPAN</strong></div>
    <div class="bottom"><div><small>SPECIALTY COFFEE</small><b>Argopuro Natural</b><span>Natural · Berries · Floral Hint · Honey</span></div><button id="buy">BELI ROASTBEAN</button></div>
  </main>
  <div id="loading">Memuat kebun kopi...</div><div id="toast"></div>
</div>
<script src="config.js"></script><script src="app.js"></script>
</body></html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11170f">
<title>Kamanika — Argopuro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="panorama"></div>
  <div class="shade"></div>

  <header>
    <div class="brand">KAMANIKA <span>ROASTERY</span></div>
  </header>

  <main>
    <div class="swipe-info">
      <div class="hand">↔</div>
      <b>Geser untuk melihat kebun</b>
      <span>Geser layar ke kiri atau kanan</span>
    </div>

    <div class="speech">
      <div class="tail"></div>
      <b>Halo, Teman Ngopi!</b>
      <span id="speechText"></span>
    </div>

    <div class="farmer">
      <img id="farmerFrame" alt="Petani Argopuro">
    </div>

    <div class="pouch">
      <img id="pouchImg" alt="Kamanika Argopuro Natural">
    </div>

    <div class="hud">
      <small>PANDANGAN</small>
      <strong id="direction">DEPAN</strong>
    </div>

    <div class="bottom">
      <div>
        <small>SPECIALTY COFFEE</small>
        <b>Argopuro Natural</b>
        <span>Natural · Berries · Floral Hint · Honey</span>
      </div>
      <button id="buyBtn">BELI ROASTBEAN</button>
    </div>
  </main>

  <div id="loading">Memuat...</div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
